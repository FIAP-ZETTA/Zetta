version: '3.8'

networks:
  zetta_net:
    driver: bridge

services:

  # ── ZettaScan — Motor de análise de segurança ─────────────────────────────
  zettascan:
    build:
      # O contexto é a pasta do código-fonte
      context: ../zettascan
      # O Dockerfile é o arquivo que está aqui na pasta DevOPS
      dockerfile: Dockerfile.zettascan
    restart: unless-stopped
    networks:
      - zetta_net
    ports:
      - "8000:8000"
    # Puxa o .env da raiz do projeto
    env_file: ../.env
    environment:
      # A chave Gemini virá do env_file
      PYTHONUNBUFFERED: "1"

  # ── ZettaDash — Frontend Dashboard ─────────────────────────────────────────
  zettadash:
    build:
      context: ../zettadash
      dockerfile: Dockerfile.zettadash
    networks:
      - zetta_net
