version: '3.8'

networks:
  zetta_net:
    driver: bridge

services:

  # ── ZettaScan — Motor de análise de segurança ─────────────────────────────
  zettascan:
    build:
      context: ../zettascan
      dockerfile: ../DevOPS/Dockerfile.zettascan
    restart: unless-stopped
    networks:
      - zetta_net
    ports:
      - "8000:8000"
    # Puxa o .env da raiz do projeto
    env_file: ../.env
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ── ZettaDash — Frontend Dashboard ─────────────────────────────────────────
  zettadash:
    build:
      context: ../zettadash
      dockerfile: ../DevOPS/Dockerfile.zettadash
      args:
        # Dentro da rede Docker, zettadash chama zettascan pelo nome do serviço
        NEXT_PUBLIC_ZETTASCAN_URL: http://zettascan:8000
    restart: unless-stopped
    networks:
      - zetta_net
    ports:
      - "3000:3000"
    depends_on:
      zettascan:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_ZETTASCAN_URL: http://zettascan:8000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
